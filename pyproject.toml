[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-intelligence"
version = "0.1.0"
description = "ClauseTrace: Evaluation-driven Contract Intelligence Assistant for legal clause retrieval on LegalBench-RAG (CUAD-mini)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "PyYAML>=6.0.0",
    "pydantic>=2.5.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "streamlit>=1.35.0",
    "huggingface-hub>=0.23.0",
    "pytest>=8.0.0",
]

[project.scripts]
clausetrace = "contract_intelligence.cli:app"

[tool.setuptools.packages.find]
include = ["contract_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

